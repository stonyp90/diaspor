{{/*
DIASPOR_JWT_SECRET (and any sibling values in .Values.secretEnv) are
materialised here so they can be mounted via envFrom in deployment.yaml.

The `required` helper fails `helm install` fast if the JWT secret is
empty — this is the load-bearing auth secret for the API server. Either
pass it explicitly:

    helm install diaspor-api ./deploy/helm/diaspor-api-server \
        --set secretEnv.DIASPOR_JWT_SECRET=$(openssl rand -hex 32)

…or point a values file at an external secret manager (Sealed Secrets,
External Secrets Operator, Vault) and remove the field here.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "diaspor-api-server.secretName" . }}
  labels:
    {{- include "diaspor-api-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  DIASPOR_JWT_SECRET: {{ required "DIASPOR_JWT_SECRET must be set in values (e.g. --set secretEnv.DIASPOR_JWT_SECRET=$(openssl rand -hex 32))" .Values.secretEnv.DIASPOR_JWT_SECRET | quote }}
  {{- range $key, $val := .Values.secretEnv }}
  {{- if and (ne $key "DIASPOR_JWT_SECRET") (ne (toString $val) "") }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
  {{- end }}
