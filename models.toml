# diaspor model catalog — workspace-wide source of truth for the OSS model
# weights that `diaspor-infer`'s ModelHub knows how to resolve. Embedded into
# the `diaspor-infer` crate at compile time via `include_str!` and parsed by
# `crates/diaspor-infer/src/catalog.rs`.
#
# # How entries land here
#
# 1. A Phase 2 adapter (e.g. `MediaPipePoseExtractor`) needs an ONNX file.
# 2. We pin the exact upstream URL, format, byte size, sha256, and license.
# 3. ModelHub::resolve downloads the file once, verifies the sha256, and
#    caches it under `~/.diaspor/models/<id>@<sha256-prefix>/`.
#
# # Pinning policy
#
# An entry is considered *pinned* once its `sha256` field is set to a 64-char
# hex string AND its `bytes` field is set to a positive integer. Unpinned
# entries (the placeholder `"PENDING_FIRST_PULL"` value) are refused at
# runtime UNLESS the environment variable `DIASPOR_TRUST_UNPINNED=1` is set,
# in which case ModelHub downloads, prints the observed sha256, and
# instructs the operator to commit the value here.
#
# # License policy
#
# Default install ships only Apache-2.0, MIT, BSD, or other clearly
# permissive weights. Research / non-commercial weights (pyannote, DINOv2,
# …) are marked `nonfree = true` and require building with
# `--features nonfree-models` to be returned by ModelHub::resolve. The
# runtime additionally prints a one-line license notice the first time such
# a model is loaded in a session.
#
# # Provenance
#
# Every adapter that consumes a model must emit `model_provenance` rows
# matching `docs/schema/score-v1.json`'s shape, with `id`, `sha256`, and
# `version` echoed from this catalog. This is how a downstream score sidecar
# stays traceable back to the exact bytes that produced it.

schema_version = 1

# ---------------------------------------------------------------------------
# Test fixture (pinned). This entry exists so the ModelHub end-to-end test in
# `crates/diaspor-infer/tests/hub_smoke.rs` can drive every code path
# (download, sha256-verify, cache hit, offline-block) against a real but
# trivially small ONNX file that does not require network access at test
# time — the test ships the bytes inline.
# ---------------------------------------------------------------------------
[[models]]
id = "test-identity-fp32@1"
description = "1x1 identity ONNX fixture used by the diaspor-infer test suite. Trivially exposes the ORT load + Session::run path without any real model weights."
format = "onnx"
url = "file://crates/diaspor-infer/tests/fixtures/identity.onnx"
# The sha256 + bytes are filled in by the test harness once the fixture is
# generated and frozen. See `crates/diaspor-infer/tests/fixtures/README.md`.
sha256 = "PENDING_FIRST_PULL"
bytes = 0
license = "Apache-2.0"
feature_gate = "ort-cpu"
nonfree = false
notes = "Test fixture. Operators should not enable this in production catalogs."

