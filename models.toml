# Phase 2 — pose estimation
# ---------------------------------------------------------------------------
[[models]]
id = "mediapipe-pose-heavy@1"
description = "MediaPipe BlazePose GHUM Heavy (33 keypoints, 3D). Primary pose extractor; matches the BlazePose topology that score-v1.json's `modalities.pose.keypoints[33]` field is contractually committed to."
format = "task"
url = "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_heavy/float16/latest/pose_landmarker_heavy.task"
sha256 = "PENDING_FIRST_PULL"
bytes = 0
license = "Apache-2.0"
feature_gate = "mediapipe-pose"
nonfree = false
notes = "MediaPipe ships a .task bundle. The Phase 2 adapter extracts the tflite blob from the bundle and converts to ORT inputs via the mediapipe-rs crate; see crates/diaspor-vision/src/pose.rs."

[[models]]
