description = "RTMPose-l body keypoint estimator (Apache-2.0). Alternate pose extractor for benchmarking against the MediaPipe primary."
format = "onnx"
url = "https://huggingface.co/openmmlab/rtmpose-l-coco/resolve/main/rtmpose-l-coco.onnx"
sha256 = "PENDING_FIRST_PULL"
bytes = 0
license = "Apache-2.0"
feature_gate = "rtmpose"
nonfree = false

