    AnalysisAccepted:
      description: |
        Analysis accepted for asynchronous processing. The `Location`
        header points at `/v1/analyses/{id}`; the caller polls that URL
        until the score record is ready.
      headers:
        Location:
          required: true
          schema:
            type: string
            format: uri-reference
          description: URL to poll for the score record.
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: Seconds to wait before the first poll.
      content:
        application/json:
          schema:
            type: object
            required: [id, status]
            properties:
              id:
                type: string
              status:
                type: string
                enum: [queued, running]

  schemas:
    ScoreRecord:
      description: |
        Full score record. Authoritative schema is
        `docs/schema/score-v1.json`. OpenAPI 3.1 is JSON-Schema-compatible,
        so we `$ref` the existing file rather than duplicating the
        definition.
      $ref: '../schema/score-v1.json'

    Modalities:
      description: Per-modality outputs (at least one present).
      $ref: '../schema/score-v1.json#/$defs/Modalities'

    PoseModality:
      description: 33-keypoint 3D body pose (BlazePose topology).
      $ref: '../schema/score-v1.json#/$defs/PoseModality'

    FaceModality:
      description: 478-landmark facial geometry (MediaPipe FaceMesh).
      $ref: '../schema/score-v1.json#/$defs/FaceModality'

    ProsodyModality:
      description: Vocal-prosody features (eGeMAPSv02 + ComParE2016).
      $ref: '../schema/score-v1.json#/$defs/ProsodyModality'

    CredibilityModality:
      description: |
        Credibility-signal output. **NOT lie detection.** Peer-reviewed
        ceiling ~74%, human baseline ~54%. Refused at the gateway for
        `forensic`, `hiring`, `insurance`, `law_enforcement`,
        `eu_workplace`, and `eu_education` verticals. Every response
        carries `human_baseline_disclosed`, `ceiling_disclosed`,
        `confidence_band`, `labs_preview`, and `vertical_attestation`.
      $ref: '../schema/score-v1.json#/$defs/CredibilityModality'

    JudgeModality:
      description: Per-discipline sport-judge score.
      $ref: '../schema/score-v1.json#/$defs/JudgeModality'

    Keypoint3d:
      description: One 3D keypoint with a visibility score.
      $ref: '../schema/score-v1.json#/$defs/Keypoint3d'

    ModelProvenance:
      description: Model identity / adapter / runtime / latency record for one modality.
      $ref: '../schema/score-v1.json#/$defs/ModelProvenance'

    VerticalAttestation:
      description: |
        Tenant-declared vertical for `/v1/credibility`. Forbidden verticals
        (`forensic`, `hiring`, `insurance`, `law_enforcement`,
        `eu_workplace`, `eu_education`) are intentionally absent — they
        are refused at the gateway and are not part of the enum surfaced
        to clients. The set of permitted values mirrors the
        `vertical_attestation` enum in `score-v1.json`'s
        `CredibilityModality`.
      type: string
      enum:
        - coaching
        - sport_judging
        - interview_platform
        - deposition_recording
        - research

    ApiError:
      description: |
        Canonical error envelope. Every non-2xx response in the spec
        uses this shape. The Python and TypeScript SDKs raise
        `ApiError` (or its subclasses keyed off `code`) for any
        response with this body.
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            Stable machine-readable error identifier. SDKs branch on this
            value, not on `message` (which is human-readable and may
            change without notice).
          enum:
            - unauthorized
            - forbidden
            - not_found
            - rate_limited
            - vertical_refused
            - validation_error
            - not_implemented
            - internal_error
        message:
          type: string
          description: Human-readable error message. Not stable across releases.
        details:
          type: object
          description: |
            Optional structured details. Shape varies by `code`. For
            `rate_limited`, carries `limit`, `window_seconds`,
            `retry_after_seconds`. For `vertical_refused`, carries
            `declared_vertical` and `permitted_verticals`. For
            `not_implemented`, carries `status: "scaffolding"` and a
            `gating_milestone` reference.
          additionalProperties: true
        request_id:
          type: string
          description: Server-assigned request identifier — quote this when filing a support ticket.

    SessionEndReason:
      description: Why a `/v1/stream` session ended.
      type: string
      enum:
        - client_closed
        - server_closed
        - whip_disconnected
        - bot_left_meeting
        - meeting_ended
        - consent_withdrawn
        - daily_cap_reached
        - rate_limited
        - error

    IngestEvent:
      description: |
        One message on the `/v1/stream` WebSocket. Either a score event
        (`type: "score"`, carrying a `ScoreRecord` with `kind: "event"`
        or `"window"`) or a control frame announcing session lifecycle.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          enum: [session_started, session_ended, score, error]
          description: Frame discriminator.
        session_id:
          type: string
          description: Server-assigned session identifier. Present on every frame.
        ts:
          type: string
          format: date-time
          description: ISO 8601 timestamp the server emitted this frame.
        score:
          description: Score record. Present when `type == "score"`.
          $ref: '#/components/schemas/ScoreRecord'
        reason:
          description: Reason the session ended. Present when `type == "session_ended"`.
          $ref: '#/components/schemas/SessionEndReason'
        error:
          description: Error envelope. Present when `type == "error"`.
          $ref: '#/components/schemas/ApiError'
