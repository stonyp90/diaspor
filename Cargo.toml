[workspace]
resolver = "3"
members = [
    "crates/diaspor-core",
    "crates/diaspor-backend-memory",
    "crates/diaspor-backend-local",
    "crates/diaspor-conformance",
    "crates/diaspor-fuse",
    "crates/diaspor-winfsp",
    "crates/diaspor-index",
    "crates/diaspor-cli",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
authors = ["Anthony Paquet <anthony@diaspor.io>"]
license = "AGPL-3.0-only"
repository = "https://github.com/stonyp90/diaspor"
homepage = "https://diaspor.io"
documentation = "https://docs.rs/diaspor-core"
readme = "README.md"
keywords = ["non-verbal-ai", "scoring", "vfs", "self-hosted", "video"]
categories = ["multimedia::video", "filesystem", "command-line-utilities", "asynchronous"]

[workspace.dependencies]
# Internal crates
diaspor-core = { version = "0.1.0-alpha.1", path = "crates/diaspor-core" }
diaspor-backend-memory = { version = "0.1.0-alpha.1", path = "crates/diaspor-backend-memory" }
diaspor-backend-local = { version = "0.1.0-alpha.1", path = "crates/diaspor-backend-local" }
diaspor-index = { version = "0.1.0-alpha.1", path = "crates/diaspor-index" }

# Error handling
thiserror = "2.0"

# Async runtime
tokio = { version = "1.42", default-features = false }
async-trait = "0.1"
futures = "0.3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Concurrency
parking_lot = "0.12"
dashmap = "6.1"

# Utilities
bytes = "1.9"
bitflags = "2.6"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Time
time = { version = "0.3", features = ["serde", "macros"] }

# Testing
tempfile = "3.14"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Allow some pedantic lints that are too noisy for a starter project
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
multiple_crate_versions = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
