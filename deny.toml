[graph]
all-features = true

[advisories]
yanked = "warn"
ignore = []

[licenses]
allow = [
    # Workspace's own license — every `diaspor-*` crate publishes under this.
    "AGPL-3.0-only",
    # Permissive licenses we accept from upstream crates.
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "BSL-1.0",
    # Transitive deps that need explicit allowance:
    "MPL-2.0",                # option-ext (via dirs crate)
    "CDLA-Permissive-2.0",    # webpki-roots (via rustls)
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
