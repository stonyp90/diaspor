[package]
name = "diaspor-cli"
description = "Diaspor CLI and runtime daemon - self-hosted non-verbal AI for Canadian security and legal teams. Ships two binaries: `diaspor` (one-shot operator CLI) and `diaspor-agent` (long-running runtime daemon)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "diaspor"
path = "src/main.rs"

[[bin]]
name = "diaspor-agent"
path = "src/bin/diaspor-agent.rs"

# Examples in `examples/` are auto-discovered by Cargo. The transcribe-demo
# example demonstrates the public Transcriber/Tagger/MediaExtractor trait
# surface that M5 (FFmpeg + whisper.cpp) will fill in with production
# implementations.

[lints]
workspace = true

[dependencies]
diaspor-core.workspace = true
diaspor-backend-memory.workspace = true
diaspor-backend-local.workspace = true
diaspor-index.workspace = true
diaspor-imagegen = { workspace = true, features = ["remote"] }
async-trait.workspace = true
bytes.workspace = true
clap.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "io-std", "fs"] }
tracing.workspace = true
tracing-subscriber.workspace = true
