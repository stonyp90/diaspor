[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "diaspor"
version = "0.1.0a1"
description = "Official Python client SDK for the Diaspor non-verbal video AI API. Thin client — calls api.diaspor.io. Heavy self-hosted core is the Rust workspace at github.com/stonyp90/diaspor (dual-licensed AGPL-3.0 or commercial)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Anthony Paquet", email = "anthony@diaspor.io" },
]
keywords = [
    "diaspor",
    "video-ai",
    "pose-estimation",
    "face-mesh",
    "prosody",
    "credibility",
    "sport-judging",
    "whip",
    "webrtc",
    "meeting-bot",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "websockets>=12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://diaspor.io"
Documentation = "https://developers.diaspor.io"
Repository = "https://github.com/stonyp90/diaspor"
Issues = "https://github.com/stonyp90/diaspor/issues"
"API Reference" = "https://developers.diaspor.io/api"

[tool.hatch.build.targets.wheel]
packages = ["src/diaspor"]

[tool.hatch.build.targets.sdist]
include = [
    "src/diaspor",
    "tests",
    "README.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/diaspor", "tests"]
plugins = ["pydantic.mypy"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
