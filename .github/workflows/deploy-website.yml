name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-website
  cancel-in-progress: false

env:
  AWS_REGION: ca-central-1
  S3_BUCKET: diaspor-io-site-436136277668
  CLOUDFRONT_DISTRIBUTION_ID: E5ZB29XQZG1PT

jobs:
  deploy:
    name: Deploy website to S3 + CloudFront
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://diaspor.io
    steps:
      - uses: actions/checkout@v4

      - name: Validate HTML (EN + FR)
        run: |
          npm install --no-save html-validate@8
          npx html-validate website/index.html
          npx html-validate website/fr/index.html

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::436136277668:role/github-actions-diaspor
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync website to S3
        working-directory: website
        run: |
          # HTML files — short cache, must-revalidate
          for f in index.html fr/index.html; do
            aws s3 cp "$f" "s3://${{ env.S3_BUCKET }}/$f" \
              --cache-control "public, max-age=300, must-revalidate" \
              --content-type "text/html; charset=utf-8" \
              --region "${{ env.AWS_REGION }}"
          done

          # CSS — short cache (filename doesn't hash)
          aws s3 cp styles.css "s3://${{ env.S3_BUCKET }}/styles.css" \
            --cache-control "public, max-age=3600, must-revalidate" \
            --content-type "text/css" \
            --region "${{ env.AWS_REGION }}"

          # Static assets — long cache
          for ext in svg png ico webmanifest txt xml; do
            find . -maxdepth 2 -name "*.$ext" | while read -r f; do
              aws s3 cp "$f" "s3://${{ env.S3_BUCKET }}/$f" \
                --cache-control "public, max-age=31536000, immutable" \
                --region "${{ env.AWS_REGION }}"
            done
          done

          # Screenshots directory
          if [ -d screenshots ]; then
            aws s3 sync screenshots/ "s3://${{ env.S3_BUCKET }}/screenshots/" \
              --cache-control "public, max-age=31536000, immutable" \
              --region "${{ env.AWS_REGION }}"
          fi

      - name: Invalidate CloudFront cache
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          echo "Created invalidation: $INVALIDATION_ID"
          aws cloudfront wait invalidation-completed \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --id "$INVALIDATION_ID"
          echo "Invalidation complete"

      - name: Summary
        run: |
          echo "### Website deployed :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- S3: \`${{ env.S3_BUCKET }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- CloudFront: \`${{ env.CLOUDFRONT_DISTRIBUTION_ID }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Live: https://diaspor.io" >> $GITHUB_STEP_SUMMARY
