name: Release Desktop App

# Tag-triggered Tauri release for the VFS desktop app under apps/vfs-desktop.
# Fires on the same `v*` tags as .github/workflows/release.yml, so a single
# `git push --tags` produces both the Rust CLI archives AND the desktop
# .dmg / .msi / .AppImage artifacts attached to the GitHub release.
#
# `release.yml` and this file share `tag_name`; action-gh-release upserts the
# release (the CLI workflow creates it first, this one uploads desktop assets
# onto the same release).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag name to release (e.g., v0.1.0-alpha.3)'
        required: true
        default: 'v0.1.0-alpha.3'

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: '20'
  RUST_VERSION: 'stable'

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
            rust_target: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: Windows
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
          - platform: Linux
            os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/vfs-desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev \
            ca-certificates

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/vfs-desktop/src-tauri -> target
          key: vfs-desktop-${{ matrix.os }}-${{ github.sha }}

      - name: Install desktop dependencies
        working-directory: apps/vfs-desktop
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Validate macOS signing cert (preflight, fail-soft)
        if: matrix.os == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # 8 consecutive releases (alpha.6..alpha.13) failed because Tauri's
          # bundler invoked `security import` on a base64'd APPLE_CERTIFICATE
          # secret that wasn't a valid p12, causing SecKeychainItemImport to
          # bail mid-build. Pre-validate against a throwaway keychain here
          # so signing only proceeds when the cert is actually importable;
          # otherwise we ship an unsigned .dmg with a workflow warning.
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "APPLE_SIGNING_ENABLED=false" >> "$GITHUB_ENV"
            echo "::warning title=macOS code signing DISABLED::APPLE_CERTIFICATE secret not configured. .dmg ships unsigned; Gatekeeper will warn users on first launch."
            exit 0
          fi
          KCHAIN="$RUNNER_TEMP/preflight.keychain-db"
          CERT_FILE="$RUNNER_TEMP/preflight-cert.p12"
          if ! security create-keychain -p preflight "$KCHAIN"; then
            echo "APPLE_SIGNING_ENABLED=false" >> "$GITHUB_ENV"
            echo "::warning title=macOS code signing DISABLED::Preflight keychain create failed."
            exit 0
          fi
          security set-keychain-settings -lut 21600 "$KCHAIN" || true
          security unlock-keychain -p preflight "$KCHAIN" || true
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_FILE" || true
          if security import "$CERT_FILE" -k "$KCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign >/dev/null 2>&1; then
            echo "APPLE_SIGNING_ENABLED=true" >> "$GITHUB_ENV"
            echo "::notice title=macOS code signing ENABLED::APPLE_CERTIFICATE imported OK; signing + notarization will proceed."
          else
            echo "APPLE_SIGNING_ENABLED=false" >> "$GITHUB_ENV"
            echo "::warning title=macOS code signing DISABLED::APPLE_CERTIFICATE failed to import (SecKeychainItemImport). Falling back to unsigned build. Check the base64-encoded p12 + APPLE_CERTIFICATE_PASSWORD secret."
          fi
          security delete-keychain "$KCHAIN" >/dev/null 2>&1 || true
          rm -f "$CERT_FILE"

      - name: Configure updater artifacts
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            enabled=true
          else
            enabled=false
            echo "::warning title=Updater signing unavailable::TAURI_SIGNING_PRIVATE_KEY is absent. Installers will build without an updater feed."
          fi
          echo "UPDATER_SIGNING_ENABLED=$enabled" >> "$GITHUB_ENV"
          printf '{"bundle":{"createUpdaterArtifacts":%s}}\n' "$enabled" > "$RUNNER_TEMP/updater-config.json"

      - name: Build Desktop (macOS/Linux)
        if: matrix.os != 'windows-latest'
        working-directory: apps/vfs-desktop
        shell: bash
        run: |
          echo "Building for ${{ matrix.platform }}..."
          # Honor the preflight verdict — when the cert preflight failed,
          # unset Apple secrets so Tauri's bundler builds unsigned instead
          # of attempting (and failing) a security import.
          if [ "${{ matrix.os }}" == "macos-latest" ] && [ "$APPLE_SIGNING_ENABLED" != "true" ]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          if [ "${{ matrix.os }}" == "macos-latest" ]; then
            npm run tauri:build -- --config "$RUNNER_TEMP/updater-config.json" --target universal-apple-darwin
          else
            npm run tauri:build -- --config "$RUNNER_TEMP/updater-config.json"
          fi
        env:
          # Updater signing (Ed25519, used by tauri-plugin-updater)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code signing + notarization. When these are set, Tauri's
          # bundler auto-runs `codesign` and `notarytool` so the .dmg ships
          # signed + notarized and Gatekeeper accepts it without prompt.
          # When any are empty, Tauri logs a warning and produces an
          # unsigned .dmg (still functional, but users will see a "damaged
          # app" warning on first launch).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RUST_BACKTRACE: full

      - name: Build Desktop (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: apps/vfs-desktop
        shell: pwsh
        run: npm run tauri:build -- --config "$env:RUNNER_TEMP/updater-config.json"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RUST_BACKTRACE: full

      - name: Prepare macOS artifacts
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p release-artifacts
          if [ -d "apps/vfs-desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg" ]; then
            cp apps/vfs-desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg release-artifacts/diaspor-vfs.dmg 2>/dev/null || true
          fi
          if [ ! -f "release-artifacts/diaspor-vfs.dmg" ]; then
            cp apps/vfs-desktop/src-tauri/target/release/bundle/dmg/*.dmg release-artifacts/diaspor-vfs.dmg 2>/dev/null || {
              echo "::error::macOS DMG not found"
              exit 1
            }
          fi
          ls -lh release-artifacts/
          shasum -a 256 release-artifacts/diaspor-vfs.dmg

      - name: Collect signed macOS updater
        if: matrix.os == 'macos-latest' && env.UPDATER_SIGNING_ENABLED == 'true'
        shell: bash
        run: |
          bundle_dir="apps/vfs-desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos"
          if [ ! -d "$bundle_dir" ]; then
            bundle_dir="apps/vfs-desktop/src-tauri/target/release/bundle/macos"
          fi
          node apps/vfs-desktop/scripts/generate-update-manifest.js collect --platform macos --bundle-dir "$bundle_dir" --output-dir release-artifacts

      - name: Upload macOS artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: vfs-macos-${{ github.sha }}
          path: release-artifacts/*
          retention-days: 90
          if-no-files-found: error

      - name: Prepare Windows artifacts
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          $msiPaths = @(
            "apps/vfs-desktop/src-tauri/target/release/bundle/msi/*.msi",
            "apps/vfs-desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi"
          )
          $msi = $null
          foreach ($path in $msiPaths) {
            $found = Get-ChildItem -Path $path -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $msi = $found; break }
          }
          if ($msi) {
            Copy-Item $msi.FullName -Destination "release-artifacts/diaspor-vfs.msi"
            Get-ChildItem release-artifacts
            Get-FileHash -Path "release-artifacts/diaspor-vfs.msi" -Algorithm SHA256
          } else {
            Write-Host "::error::Windows MSI not found"
            exit 1
          }

      - name: Collect signed Windows updater
        if: matrix.os == 'windows-latest' && env.UPDATER_SIGNING_ENABLED == 'true'
        shell: bash
        run: |
          bundle_dir="apps/vfs-desktop/src-tauri/target/release/bundle/msi"
          if [ ! -d "$bundle_dir" ]; then
            bundle_dir="apps/vfs-desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi"
          fi
          node apps/vfs-desktop/scripts/generate-update-manifest.js collect --platform windows --bundle-dir "$bundle_dir" --output-dir release-artifacts

      - name: Upload Windows artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: vfs-windows-${{ github.sha }}
          path: release-artifacts/*
          retention-days: 90
          if-no-files-found: error

      - name: Prepare Linux artifacts
        if: matrix.os == 'ubuntu-22.04'
        run: |
          mkdir -p release-artifacts
          cp apps/vfs-desktop/src-tauri/target/release/bundle/appimage/*.AppImage release-artifacts/diaspor-vfs.AppImage 2>/dev/null || {
            echo "::error::Linux AppImage not found"
            exit 1
          }
          chmod +x release-artifacts/diaspor-vfs.AppImage
          ls -lh release-artifacts/
          sha256sum release-artifacts/diaspor-vfs.AppImage

      - name: Collect signed Linux updater
        if: matrix.os == 'ubuntu-22.04' && env.UPDATER_SIGNING_ENABLED == 'true'
        shell: bash
        run: |
          node apps/vfs-desktop/scripts/generate-update-manifest.js collect --platform linux --bundle-dir apps/vfs-desktop/src-tauri/target/release/bundle/appimage --output-dir release-artifacts

      - name: Upload Linux artifact
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: vfs-linux-${{ github.sha }}
          path: release-artifacts/*
          retention-days: 90
          if-no-files-found: error

  attach-to-release:
    name: Attach desktop artifacts to release
    needs: [build-desktop]
    # Allow this job to run even if one platform's post-cache cleanup
    # flaked. The artifact-count guard below still gates on real artifacts
    # being produced.
    if: |
      always() &&
      (needs.build-desktop.result == 'success' || needs.build-desktop.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: vfs-macos-${{ github.sha }}
          path: artifacts/macos
        continue-on-error: true

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: vfs-windows-${{ github.sha }}
          path: artifacts/windows
        continue-on-error: true

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: vfs-linux-${{ github.sha }}
          path: artifacts/linux
        continue-on-error: true

      - name: Verify artifacts
        run: |
          echo "=== Artifact Verification ==="
          find artifacts -type f -exec ls -lh {} \;
          ARTIFACT_COUNT=$(find artifacts -type f | wc -l)
          echo "Total artifacts: $ARTIFACT_COUNT"
          if [ "$ARTIFACT_COUNT" -eq 0 ]; then
            echo "::error::No artifacts found"
            exit 1
          fi

      - name: Set up feed generator runtime
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Generate signed update feed
        env:
          RELEASE_TAG: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          APP_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('apps/vfs-desktop/src-tauri/tauri.conf.json', 'utf8')).version")
          node apps/vfs-desktop/scripts/generate-update-manifest.js manifest --artifacts artifacts --output artifacts/latest.json --version "$APP_VERSION" --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY"

      - name: Attach to existing release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          VERSION="$RELEASE_TAG"
          # The CLI workflow (.github/workflows/release.yml) creates the
          # release first via softprops/action-gh-release. If it hasn't run
          # yet (or this fires standalone via workflow_dispatch), create the
          # release here.
          if ! gh release view "$VERSION" --repo ${{ github.repository }} &>/dev/null; then
            echo "Release $VERSION does not exist yet; creating."
            gh release create "$VERSION" \
              --title "Diaspor $VERSION" \
              --generate-notes \
              --target ${{ github.sha }} \
              --repo ${{ github.repository }}
          fi
          echo "Uploading desktop artifacts to $VERSION..."
          for artifact in artifacts/macos/* artifacts/windows/* artifacts/linux/*; do
            if [ -f "$artifact" ]; then
              echo "  Uploading $artifact"
              gh release upload "$VERSION" "$artifact" --clobber --repo ${{ github.repository }}
            else
              echo "  Skipping $artifact (not built)"
            fi
          done
          # Publish the feed last, after every referenced payload has uploaded.
          if [ -f artifacts/latest.json ]; then
            gh release upload "$VERSION" artifacts/latest.json --clobber --repo "$GITHUB_REPOSITORY"
          fi
          echo "Done. Release URL: https://github.com/${{ github.repository }}/releases/tag/$VERSION"
